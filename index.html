<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#192333">
    <title>掟彩虹 Coinbow · 測試版</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f1520; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #192333; outline: none; touch-action: none; }
      /* Desktop: show a phone-shaped (portrait) viewport, the primary target. */
      @media (min-aspect-ratio: 3/4) { #unity-canvas { height: 100%; width: auto; aspect-ratio: 9 / 19.5; max-width: 100%; border-radius: 18px; box-shadow: 0 0 40px #000a; } }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font: 600 18px -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; gap: 14px; pointer-events: none; }
      #bar { width: 220px; height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
      #fill { width: 0; height: 100%; background: linear-gradient(90deg,#ed3151,#f9dc4b,#5ea837,#43a9cc); }
      #err { color: #ffb4b4; font-size: 14px; max-width: 80%; text-align: center; }
    </style>
  </head>
  <body>
    <div id="frame"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading"><div>🌈 掟彩虹 載入中…</div><div id="bar"><div id="fill"></div></div><div id="err"></div></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Coinbow",
        productName: "掟彩虹 Coinbow",
        productVersion: "0.1.0-m1",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (p) { document.getElementById("fill").style.width = Math.round(p * 100) + "%"; })
      .then(function () { document.getElementById("loading").style.display = "none"; })
      .catch(function (message) { document.getElementById("err").textContent = "載入失敗：" + message; });
    </script>
  </body>
</html>
